<title>Thai GL 追星習慣問卷</title>

<style>
:root{--pink:#F27FA0;--pink-soft:#FBD5E0;--pink-bg:#FFF6F8;--navy:#2E3350;--muted:#7D8299;--line:#F0E3E8;--err:#E2607A;--radius:18px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--navy);background:linear-gradient(180deg,#FFF3F6 0%,#FFF9F7 45%,#F7F3FF 100%);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
.hero{margin:16px 0 0;border-radius:var(--radius);overflow:hidden;box-shadow:0 10px 30px rgba(242,127,160,.18);background:#fff}
.hero img{display:block;width:100%;height:auto}
.card{background:#fff;border-radius:var(--radius);box-shadow:0 8px 24px rgba(46,51,80,.06);margin-top:16px;overflow:hidden}
.banner img{display:block;width:100%;height:auto}
.body{padding:20px 20px 24px}
h1{font-size:22px;margin:0 0 8px;line-height:1.35}
h2{font-size:18px;margin:0 0 2px}
.lead{color:var(--muted);font-size:14px;margin:0 0 16px}
.step{font-size:12px;color:var(--pink);font-weight:500;letter-spacing:.04em;margin:0 0 4px}
.lang{display:inline-flex;background:var(--pink-bg);border-radius:999px;padding:4px;margin-bottom:16px}
.lang button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.lang button.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.08);font-weight:500}
.progress{display:flex;gap:6px;margin:0 0 14px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--pink-soft)}
.progress i.on{background:var(--pink)}
.q{padding:18px 0;border-top:1px solid var(--line)}
.q.first{border-top:0;padding-top:6px}
.t{font-weight:500;font-size:16px;margin:0 0 2px;line-height:1.5}
.t .n{color:var(--pink);font-weight:700;margin-right:6px}
.h{font-size:12px;color:var(--muted);margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--pink-soft)}
.opt.on{border-color:var(--pink);background:var(--pink-bg)}
.opt input{margin:5px 0 0;accent-color:var(--pink);flex:none;width:16px;height:16px}
.opt span{font-size:15px}
.err{color:var(--err);font-size:13px;margin-top:8px;display:none}
.q.bad .err{display:block}
.q.bad .opt{border-color:#F5C4CF}
.q.bad input[type=text],.q.bad input[type=number]{border-color:#F5C4CF}
.alloc{display:grid;gap:10px}
.arow{display:grid;grid-template-columns:1fr 84px;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:12px}
.arow .name{font-weight:500;font-size:15px}
.arow .def{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.arow input{width:84px;height:44px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:18px;text-align:center;color:var(--navy);background:#fff}
.arow input:focus{outline:0;border-color:var(--pink)}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--pink-bg);font-size:14px}
.total b{font-size:18px}
.total.ok{background:#E9F7F1;color:#2F7D5F}
.total.over{background:#FDE8EC;color:var(--err)}
.text input[type=text]{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:15px;color:var(--navy)}
.text input[type=text]:focus{outline:0;border-color:var(--pink)}
.text .row{display:flex;gap:8px;align-items:center}
.text .row input[type=text]{flex:1}
.mini{flex:none;border:1.5px solid var(--pink-soft);background:#fff;color:var(--pink);border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.mini:hover{background:var(--pink-bg)}
.note{background:var(--pink-bg);border-radius:12px;padding:12px 14px;font-size:13.5px;margin:8px 0 12px;line-height:1.6}
.note b{display:block;margin-bottom:4px}
.note ol,.note ul{margin:4px 0 0;padding-left:20px}
.note .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0}
.note .kv span:nth-child(odd){color:var(--muted)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);margin-top:12px;cursor:pointer}
.consent input{accent-color:var(--pink);margin:4px 0 0;flex:none;width:16px;height:16px}
.consent span{flex:1;line-height:1.55}
.nav{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;border:0;border-radius:999px;padding:14px 18px;font:inherit;font-size:16px;font-weight:500;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.p{background:linear-gradient(135deg,#F79BB6,#F27FA0);color:#fff;box-shadow:0 8px 18px rgba(242,127,160,.35)}
.btn.p:disabled{opacity:.6;cursor:default}
.btn.s{background:var(--pink-bg);color:var(--navy);flex:0 0 auto;padding:14px 20px}
.navErr{color:var(--err);font-size:13px;text-align:center;margin-top:10px;min-height:1em}
.end{text-align:center;padding:40px 20px 36px}
.end .big{font-size:44px;line-height:1;margin-bottom:12px}
.end h2{margin-bottom:8px}
.end p{color:var(--muted);font-size:15px;max-width:420px;margin:0 auto}
.winners{margin:16px auto 0;max-width:420px;text-align:left;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.winners table{width:100%;border-collapse:collapse;font-size:14px}
.winners th,.winners td{padding:10px 12px;border-top:1px solid var(--line);text-align:left}
.winners th{background:var(--pink-bg);color:var(--muted);font-weight:500;border-top:0;font-size:12.5px;white-space:nowrap}
.winners td:first-child{color:var(--pink);font-weight:700;width:48px}
.hp{position:absolute;left:-9999px;top:-9999px;opacity:0;height:0;width:0;overflow:hidden}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:20px;letter-spacing:.06em}
@media (max-width:480px){.body{padding:16px 16px 20px}.arow{grid-template-columns:1fr 72px;gap:10px}.arow input{width:72px}h1{font-size:20px}}
</style>

Q.keep_two.tw.o = FEATURES.map(f => f.tw.n);
Q.keep_two.cn.o = FEATURES.map(f => f.cn.n);

const QKEYS = SECTIONS.reduce((a, s) => a.concat(s.qs), []);
const NUM = {}; QKEYS.forEach((k, i) => { NUM[k] = i + 1; });

// ------------------------------------------------------------------ 狀態
const A = {};          // answers（值一律存繁體正式字串）
let step = 0;          // 0 = intro, 1..6 = sections, 'out', 'done'
let sending = false;
const root = document.getElementById('app');

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ui(k){ return UI[lang][k]; }
function fmt(s, o){ return s.replace(/\{(\w+)\}/g, (_, k) => o[k]); }
function visible(id){ const q = Q[id]; return !q.show || q.show(); }
function allocSum(){ return FEATURES.reduce((s, f) => s + (A.alloc && Number.isFinite(A.alloc[f.key]) ? A.alloc[f.key] : 0), 0); }

// ------------------------------------------------------------------ 畫面
function render(){
  if (CFG.closed) root.innerHTML = closedHtml();
  else if (step === 0) root.innerHTML = introHtml();
  else if (step === 'out') root.innerHTML = endHtml('out');
  else if (step === 'done') root.innerHTML = endHtml('done');
  else root.innerHTML = sectionHtml(step - 1);
  document.documentElement.lang = lang === 'cn' ? 'zh-Hans' : 'zh-Hant';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function langToggle(){
  return '<div class="lang" role="group" aria-label="language">' +
    '<button type="button" data-act="lang" data-lang="tw" class="' + (lang === 'tw' ? 'on' : '') + '">繁體中文</button>' +
    '<button type="button" data-act="lang" data-lang="cn" class="' + (lang === 'cn' ? 'on' : '') + '">简体中文</button>' +
    '</div>';
}

function introHtml(){
  return '<div class="hero"><img src="' + esc(asset('header')) + '" alt=""></div>' +
    '<div class="card"><div class="body">' + langToggle() +
      '<h1>' + esc(ui('title')) + '</h1>' +
      '<p class="lead">' + esc(ui('lead')) + '<br>' + esc(ui('deadlineLine')) + '</p>' +
      '<div class="nav"><button type="button" class="btn p" data-act="start">' + esc(ui('start')) + '</button></div>' +
    '</div></div>';
}

function endHtml(kind){
  const t = kind === 'out' ? ui('outTitle') : ui('doneTitle');
  const m = kind === 'out' ? ui('outMsg') : ui('doneMsg');
  return '<div class="card"><div class="end"><div class="big">' + (kind === 'out' ? '🌸' : '💗') + '</div>' +
    '<h2>' + esc(t) + '</h2><p>' + esc(m) + '</p></div></div>';
}

function closedHtml(){
  const r = CFG.results;
  let html = '<div class="hero"><img src="' + esc(asset('header')) + '" alt=""></div><div class="card"><div class="body">' + langToggle() + '</div><div class="end" style="padding-top:0">';
  if (r && r.published && Array.isArray(r.winners) && r.winners.length) {
    html += '<div class="big">🎁</div><h2>' + esc(ui('resultsTitle')) + '</h2><p>' + esc(ui('resultsMsg')) + '</p>' +
      '<div class="winners"><table><thead><tr><th>' + esc(ui('colRank')) + '</th><th>' + esc(ui('colContact')) + '</th><th>' + esc(ui('colPrize')) + '</th></tr></thead><tbody>' +
      r.winners.map((w, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(w.contact || '') + '</td><td>' + esc(w.prize || ui('prizeTBD')) + '</td></tr>').join('') +
      '</tbody></table></div>';
  } else {
    html += '<div class="big">🌸</div><h2>' + esc(ui('closedTitle')) + '</h2><p>' + esc(ui('closedMsg')) + '</p>';
  }
  return html + '</div></div>';
}

function sectionHtml(i){
  const s = SECTIONS[i];
  let html = '<div class="card"><div class="banner"><img src="' + esc(asset(s.img)) + '" alt=""></div><div class="body">';
  html += '<div class="progress">' + SECTIONS.map((_, k) => '<i class="' + (k <= i ? 'on' : '') + '"></i>').join('') + '</div>';
  html += '<p class="step">' + esc(fmt(ui('step'), { a: i + 1, b: SECTIONS.length })) + '</p>';
  html += '<h2>' + esc(s[lang]) + '</h2>';
  s.qs.forEach((id, k) => { html += '<div id="slot-' + id + '">' + qHtml(id, k === 0) + '</div>'; });
  const last = i === SECTIONS.length - 1;
  html += '<div class="nav">' +
    '<button type="button" class="btn s" data-act="back">' + esc(ui('back')) + '</button>' +
    '<button type="button" class="btn p" data-act="next" id="nextBtn">' + esc(last ? ui('submit') : ui('next')) + '</button>' +
    '</div><div class="navErr" id="navErr"></div>';
  html += '</div></div>';
  return html;
}

function hintFor(q){
  if (q.type === 'radio') return ui('single');
  if (q.type === 'alloc') return ui('allocHint');
  if (q.type === 'check') {
    if (q.exact) return fmt(ui('exactly'), { n: q.exact });
    const parts = [ui('multi')];
    if (q.min) parts.push(fmt(ui('min'), { n: q.min }));
    if (q.max) parts.push(fmt(ui('max'), { n: q.max }));
    return parts.join('，');
  }
  if (q.type === 'text') return q.hintKey ? ui(q.hintKey) : ui('optional');
  return '';
}

function qHtml(id, first){
  const q = Q[id];
  if (!visible(id)) return '';
  if (q.type === 'contact') return contactHtml(id, first);
  const L = q[lang];
  let inner = '';

  if (q.type === 'radio' || q.type === 'check') {
    const isCheck = q.type === 'check';
    const canon = q.tw.o;
    inner = '<div class="opts">' + L.o.map((label, i) => {
      const v = canon[i];
      const on = isCheck ? (A[id] || []).includes(v) : A[id] === v;
      return '<label class="opt' + (on ? ' on' : '') + '"><input type="' + (isCheck ? 'checkbox' : 'radio') + '" name="' + id + '" value="' + i + '"' + (on ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
    }).join('') + '</div>';
    if (q.lottery) inner = lotteryHtml(L.p) + inner;
  } else if (q.type === 'alloc') {
    inner = '<div class="alloc">' + FEATURES.map(f => {
      const v = A.alloc && Number.isFinite(A.alloc[f.key]) ? A.alloc[f.key] : '';
      return '<div class="arow"><div><div class="name">' + esc(f[lang].n) + '</div><div class="def">' + esc(f[lang].d) + '</div></div>' +
        '<input type="number" inputmode="numeric" min="0" max="100" step="1" data-alloc="' + f.key + '" value="' + v + '" aria-label="' + esc(f[lang].n) + '"></div>';
    }).join('') + '</div>' + totalHtml();
  } else if (q.type === 'text') {
    inner = '<div class="row"><input type="text" id="' + id + '" data-text="' + id + '" maxlength="200" placeholder="' + esc(ui(q.phKey || 'toolPh')) + '" value="' + esc(A[id] || '') + '" autocomplete="off"></div>';
  }

  const hint = hintFor(q);
  return '<div class="q' + (first ? ' first' : '') + (q.type === 'text' ? ' text' : '') + '" id="box-' + id + '">' +
    '<p class="t"><span class="n">Q' + NUM[id] + '</span>' + esc(L.t) + '</p>' +
    (hint ? '<p class="h">' + esc(hint) + '</p>' : '') + inner +
    '<div class="err"></div></div>';
}

function lotteryHtml(prizes){
  const kv = ui('lotteryKV').map(p => '<span>' + esc(p[0]) + '</span><span>' + esc(p[1]) + '</span>').join('');
  return '<div class="note"><b>' + esc(ui('lotteryTitle')) + '</b>' + esc(ui('lotteryIntro')) +
    '<div class="kv">' + kv + '</div>' +
    '<b>' + esc(ui('prizes')) + '</b><ol>' + prizes.map(p => '<li>' + esc(p) + '</li>').join('') + '</ol>' +
    '<b style="margin-top:10px">' + esc(ui('shippingTitle')) + '</b>' +
    ui('shipping').map(p => '<p style="margin:4px 0 0">' + esc(p) + '</p>').join('') +
    '</div>';
}

function totalHtml(){
  const s = allocSum();
  const cls = s === 100 ? 'ok' : (s > 100 ? 'over' : '');
  return '<div class="total ' + cls + '" id="allocTotal"><span>' + esc(ui('sumLabel')) + '</span><b>' + s + ' / 100</b></div>';
}

function contactHtml(id, first){
  const q = Q[id];
  if (!visible(id)) return '';
  const L = q[lang];
  const canCopy = q.copyFrom && visible(q.copyFrom) && (A[q.copyFrom] || '').trim();
  return '<div class="q text' + (first ? ' first' : '') + '" id="box-' + id + '">' +
    '<p class="t"><span class="n">Q' + NUM[id] + '</span>' + esc(L.t) + '</p>' +
    '<p class="h">' + esc(ui(q.hintKey)) + '</p>' +
    '<div class="row"><input type="text" id="' + id + '" data-text="' + id + '" maxlength="200" placeholder="' + esc(ui('contactPh')) + '" value="' + esc(A[id] || '') + '" autocomplete="off">' +
    (canCopy ? '<button type="button" class="mini" data-act="copy" data-from="' + q.copyFrom + '" data-to="' + id + '">' + esc(ui('sameAsAbove')) + '</button>' : '') + '</div>' +
    '<label class="consent"><input type="checkbox" data-consent="' + q.consentKey + '"' + (A[q.consentKey] ? ' checked' : '') + '><span>' + esc(ui(q.consentKey)) + '</span></label>' +
    '<div class="err"></div></div>';
}

// ------------------------------------------------------------------ 事件
root.addEventListener('click', function(e){
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.getAttribute('data-act');
  if (act === 'lang') { lang = b.getAttribute('data-lang'); render(); }
  else if (act === 'start') { step = 1; render(); }
  else if (act === 'back') { if (step > 1) { step--; render(); } else { step = 0; render(); } }
  else if (act === 'next') { onNext(); }
  else if (act === 'copy') {
    const to = b.getAttribute('data-to'), from = b.getAttribute('data-from');
    A[to] = A[from] || '';
    const inp = document.getElementById(to); if (inp) inp.value = A[to];
    clearErr(to);
  }
});

root.addEventListener('change', function(e){
  const t = e.target;
  if (t.matches('input[type=radio][name]')) {
    const id = t.name; A[id] = Q[id].tw.o[Number(t.value)];
    t.closest('.opts').querySelectorAll('.opt').forEach(o => o.classList.toggle('on', o.querySelector('input').checked));
    clearErr(id);
    refreshConditionals();
  } else if (t.matches('input[type=checkbox][name]')) {
    const id = t.name, q = Q[id], v = q.tw.o[Number(t.value)];
    let arr = (A[id] || []).slice();
    if (t.checked) {
      const limit = q.exact || q.max;
      if (limit && arr.length >= limit) {
        t.checked = false;
        setErr(id, q.exact ? fmt(ui('exactly'), { n: q.exact }) : fmt(ui('max'), { n: q.max }));
        return;
      }
      if (id === 'recruit') { if (v === '都不方便') arr = []; else arr = arr.filter(x => x !== '都不方便'); }
      if (id === 'other_interests') { if (v === '沒有，主要只追泰國 GL') arr = []; else arr = arr.filter(x => x !== '沒有，主要只追泰國 GL'); }
      if (id === 'post_event') { if (v === '不特別找') arr = []; else arr = arr.filter(x => x !== '不特別找'); }
      arr.push(v);
    } else arr = arr.filter(x => x !== v);
    A[id] = arr;
    const box = document.getElementById('box-' + id);
    if (box) box.querySelectorAll('.opt').forEach(o => { const inp = o.querySelector('input'); inp.checked = arr.includes(q.tw.o[Number(inp.value)]); o.classList.toggle('on', inp.checked); });
    clearErr(id);
    refreshConditionals();
  } else if (t.matches('[data-consent]')) {
    const key = t.getAttribute('data-consent'); A[key] = t.checked;
    clearErr(key === 'consent_research' ? 'contact_research' : 'contact_lottery');
  }
});

root.addEventListener('input', function(e){
  const t = e.target;
  if (t.matches('[data-alloc]')) {
    A.alloc = A.alloc || {};
    const raw = t.value.trim();
    A.alloc[t.getAttribute('data-alloc')] = raw === '' ? NaN : Math.max(0, Math.min(100, Math.floor(Number(raw))));
    const tot = document.getElementById('allocTotal'); if (tot) tot.outerHTML = totalHtml();
    clearErr('alloc');
  } else if (t.matches('[data-text]')) {
    const id = t.getAttribute('data-text'); A[id] = t.value; clearErr(id);
  }
});

// 重新渲染所有條件式題目。只在單選／複選變動時呼叫，不在打字時呼叫，避免輸入中失焦。
function refreshConditionals(){
  if (step === 0 || step === 'out' || step === 'done') return;
  SECTIONS[step - 1].qs.forEach((id, k) => {
    if (!Q[id].show && !(Q[id].copyFrom)) return;
    const slot = document.getElementById('slot-' + id);
    if (slot) slot.innerHTML = qHtml(id, k === 0);
  });
}

function setErr(id, msg){ const box = document.getElementById('box-' + id); if (!box) return; box.classList.toggle('bad', !!msg); const el = box.querySelector('.err'); if (el) el.textContent = msg || ''; }
function clearErr(id){ setErr(id, ''); const n = document.getElementById('navErr'); if (n) n.textContent = ''; }

function validateSection(i){
  let ok = true, firstBad = null;
  SECTIONS[i].qs.forEach(id => {
    if (!visible(id)) { setErr(id, ''); return; }
    const q = Q[id]; let err = '';
    if (q.type === 'radio') { if (!A[id]) err = ui('req'); }
    else if (q.type === 'check') {
      const arr = A[id] || [];
      if (q.exact) { if (arr.length !== q.exact) err = fmt(ui('exactly'), { n: q.exact }); }
      else if (arr.length < 1) err = ui('req');
      else if (q.min && arr.length < q.min) err = fmt(ui('min'), { n: q.min });
      else if (q.max && arr.length > q.max) err = fmt(ui('max'), { n: q.max });
    } else if (q.type === 'alloc') {
      const all = FEATURES.every(f => A.alloc && Number.isFinite(A.alloc[f.key]));
      const s = allocSum();
      if (!all || s !== 100) err = ui('sum') + s;
    } else if (q.type === 'text') {
      if (!q.optional && !(A[id] || '').trim()) err = ui('req');
    } else if (q.type === 'contact') {
      if (!(A[id] || '').trim()) err = ui('contactReq');
      else if (!A[q.consentKey]) err = ui('consentReq');
    }
    setErr(id, err);
    if (err) { ok = false; if (!firstBad) firstBad = id; }
  });
  if (firstBad) { const box = document.getElementById('box-' + firstBad); if (box) box.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  return ok;
}

function onNext(){
  if (sending) return;
  const i = step - 1;
  if (!validateSection(i)) return;
  if (step === 1 && A.follows_gl === '從來沒有') { submit('screened_out', 'out'); return; }
  if (step === SECTIONS.length) { submit('completed', 'done'); return; }
  step++; render();
}

function payload(status){
  const d = {
    status, lang, src,
    hp: (document.getElementById('hp') || {}).value || '',
    ua: navigator.userAgent.slice(0, 200)
  };
  QKEYS.forEach(k => {
    const q = Q[k];
    if (q.type === 'alloc') return;
    const empty = q.type === 'check' ? [] : '';
    d[k] = visible(k) ? (A[k] === undefined ? empty : A[k]) : empty;
  });
  d.alloc = A.alloc || {};
  d.consent_research = visible('contact_research') ? (A.consent_research ? 'yes' : 'no') : '';
  d.consent_lottery = visible('contact_lottery') ? (A.consent_lottery ? 'yes' : 'no') : '';
  return d;
}

// 把 payload 攤平成 Google 表單的欄位（陣列用「; 」串接）
function toFormBody(d){
  const E = CFG.form.entries;
  const b = new URLSearchParams();
  const put = (k, v) => { if (E[k] != null && v !== '' && v != null) b.append(E[k], String(v)); };
  const j = (v) => (Array.isArray(v) ? v.join('; ') : v);
  put('lang', d.lang); put('src', d.src); put('status', d.status); put('ua', d.ua);
  if (d.status === 'screened_out') { put('follows_gl', d.follows_gl); return b; }
  QKEYS.forEach(k => { if (Q[k].type !== 'alloc') put(k, j(d[k])); });
  FEATURES.forEach(f => put(f.key, Number(d.alloc[f.key])));
  put('consent_research', d.consent_research);
  put('consent_lottery', d.consent_lottery);
  return b;
}

function send(data){
  return new Promise((resolve, reject) => {
    if (CFG.closed || new Date() > new Date(CFG.deadline)) { reject(new Error('closed')); return; }
    if (data.hp) { setTimeout(() => resolve({ ok: true }), 300); return; } // honeypot：假裝成功
    if (!CFG.form || !CFG.form.action) {
      console.log('[survey] no form configured, payload:', data);
      setTimeout(() => resolve({ ok: true, local: true }), 400);
      return;
    }
    // Google 表單不回 CORS 標頭，用 no-cors 送出；回應是 opaque，沒有網路錯誤就視為成功。
    fetch(CFG.form.action, { method: 'POST', mode: 'no-cors', body: toFormBody(data) })
      .then(() => resolve({ ok: true }))
      .catch(reject);
  });
}

function submit(status, nextStep){
  sending = true;
  const btn = document.getElementById('nextBtn');
  if (btn) { btn.disabled = true; btn.textContent = ui('sending'); }
  send(payload(status)).then(() => { sending = false; step = nextStep; render(); })
    .catch(err => {
      sending = false;
      if (btn) { btn.disabled = false; btn.textContent = step === SECTIONS.length ? ui('submit') : ui('next'); }
      const msg = err && err.message === 'closed' ? ui('closedErr') : ui('fail') + (err && err.message ? '（' + err.message + '）' : '');
      const n = document.getElementById('navErr'); if (n) n.textContent = msg;
    });
}

// 啟動：先判斷是否截止；截止後再讀 results.json 決定要不要顯示得獎名單
CFG.closed = params.get('preview') === 'closed' || new Date() > new Date(CFG.deadline);
if (CFG.closed && CFG.resultsUrl) {
  fetch(CFG.resultsUrl + '?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(r => { CFG.results = r; render(); })
    .catch(() => { CFG.results = null; render(); });
} else {
  render();
}
})();
</script>
